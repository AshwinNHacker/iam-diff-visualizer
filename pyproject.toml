[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iamdiff"
version = "1.0.0"
description = "IAM Policy Diff Visualizer — shows effective permission change, not just a JSON diff."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ashwin N" }]
keywords = ["aws", "iam", "security", "policy", "diff", "cloud-security", "offensive-security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
web = ["flask>=2.3"]
dev = ["pytest>=7.4", "botocore>=1.34"]

[project.urls]
Homepage = "https://github.com/AshwinNHacker/iam-diff-visualizer"
Issues = "https://github.com/AshwinNHacker/iam-diff-visualizer/issues"

[project.scripts]
iamdiff = "iamdiff.cli:main"

[tool.setuptools]
packages = ["iamdiff"]

[tool.setuptools.package-data]
iamdiff = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
